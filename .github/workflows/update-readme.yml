name: Update README from cpphusky.xyz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch website text
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 \
            --user-agent "Mozilla/5.0 (compatible; GitHub Actions)" \
            https://cpphusky.xyz \
            --output /tmp/cpphusky-page.txt
          test -s /tmp/cpphusky-page.txt
          {
            printf '```\n'
            cat /tmp/cpphusky-page.txt
            printf '\n```\n'
          } > README.md
          rm /tmp/cpphusky-page.txt

      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README from cpphusky.xyz"
          git push
